version: "3.8"

services:
  miser:
    build: .
    ports:
      - "7860:7860"
    environment:
      - MISER_PORT=7860
      - MISER_MODEL=${MISER_MODEL:-qwen3.5:4b}
      - MISER_LOG_FORMAT=json
    volumes:
      - ./miser.log:/app/miser.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ollama sidecar for a fully self-contained deployment
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull qwen3.5:4b
        wait
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama_data:
