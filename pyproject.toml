[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miser"
version = "2.0.1"
description = "Zero-token local AI co-processor - auto-detects any local LLM"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "guyu-adam"}]
keywords = ["llm", "local", "mcp", "ollama", "agent", "zero-token"]

[project.scripts]
miser = "miser:main"

[project.optional-dependencies]
full = [
    "flask>=2.0",
    "rich>=12.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/guyu-adam/miser"
Issues = "https://github.com/guyu-adam/miser/issues"

[tool.setuptools]
py-modules = ["miser"]
packages = ["backends", "routes", "scripts"]
