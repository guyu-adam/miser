[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "miser"
version = "1.4.0"
description = "Local co-processor for AI coding assistants — save 98% API tokens with your local GPU"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "guyu-adam"}]
keywords = [
    "claude-code", "ai-coding-assistant", "token-saver",
    "ollama", "local-llm", "coding-agent", "copilot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flask>=2.3",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
tiktoken = ["tiktoken>=0.5"]

[project.scripts]
miser = "client:main"

[tool.setuptools.packages.find]
include = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
