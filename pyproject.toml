[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miser"
version = "1.5.0"
description = "Zero-token local AI co-processor - auto-detects any local LLM"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "guyu-adam"}]
keywords = ["llm", "local", "mcp", "ollama", "agent", "zero-token"]
dependencies = [
    "flask>=2.0",
    "rich>=12.0",
    "requests>=2.28",
]

[project.scripts]
miser = "miser:main"

[project.urls]
Homepage = "https://github.com/guyu-adam/miser"
Issues = "https://github.com/guyu-adam/miser/issues"

[tool.setuptools]
py-modules = [
    "miser", "client", "config", "facade", "tools", "model_adapter",
    "memory", "prefetch", "condenser", "task_queue", "security",
    "cache", "breaker", "quality", "mcp_server",
]

[tool.setuptools.packages.find]
include = ["backends*", "routes*", "scripts*"]
